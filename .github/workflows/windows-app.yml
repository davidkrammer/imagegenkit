name: Windows app

on:
  push:
    branches: [main]
    paths: ['windows/**', 'cli/**', 'catalog/**', 'skill/**', '.github/workflows/windows-app.yml']
  pull_request:
    paths: ['windows/**', 'cli/**', 'catalog/**', 'skill/**', '.github/workflows/windows-app.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # attach the installer to a release

jobs:
  app:
    name: Build, install and screenshot
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content windows/ImageGenKit/ImageGenKit.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $cli = (Select-String -Path cli/imagegenkit.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ($v -ne $cli) { throw "app version $v and imagegenkit $cli differ" }
          if ('${{ github.event_name }}' -eq 'release' -and '${{ github.event.release.tag_name }}' -ne "v$v") { throw "release tag ${{ github.event.release.tag_name }} isn't v$v" }
          "IGK_VERSION=$v" >> $env:GITHUB_ENV

      - name: Build
        run: dotnet publish windows/ImageGenKit/ImageGenKit.csproj -c Release -r win-x64 -p:Platform=x64 -o out/ImageGenKit

      - name: Add the command line and Python
        shell: pwsh
        run: windows/tools/bundle.ps1 -Dir out/ImageGenKit

      - name: ffmpeg for the tour video
        if: github.event_name != 'release'
        continue-on-error: true
        shell: pwsh
        run: if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg --no-progress -y | Out-Null }

      - name: Screenshots with demo data
        if: github.event_name != 'release'
        shell: powershell
        run: windows/tools/screenshots.ps1 -App out/ImageGenKit/ImageGenKit.exe -Out shots -WebApp

      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'release'
        with:
          name: screenshots
          path: shots

      - name: Installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc "/DAppVersion=$env:IGK_VERSION" windows/installer/ImageGenKit.iss
          if ($LASTEXITCODE) { throw 'installer build failed' }

      - name: The installer installs, and the app starts
        shell: pwsh
        run: |
          $setup = (Get-Item "dist/ImageGenKit-Setup-$env:IGK_VERSION.exe").FullName
          # Not -Wait: that also waits for the app the installer opens at the end, which keeps running.
          $install = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru
          if (-not $install.WaitForExit(300000)) { throw 'the installer did not finish in 5 minutes' }
          if ($install.ExitCode) { throw "the installer failed ($($install.ExitCode))" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\ImageGenKit\ImageGenKit.exe'
          if (-not (Test-Path $exe)) { throw 'not installed' }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'Programs\ImageGenKit\python\python.exe'))) { throw 'python missing' }
          Start-Sleep 10
          $p = Get-Process ImageGenKit -ErrorAction SilentlyContinue
          if (-not $p) { throw 'the app did not start after installing' }
          $p | Stop-Process -Force
          $uninstall = Join-Path $env:LOCALAPPDATA 'Programs\ImageGenKit\unins000.exe'
          $remove = Start-Process $uninstall -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -PassThru
          $remove.WaitForExit(120000) | Out-Null
          Start-Sleep 5  # the uninstaller finishes from a copy in TEMP
          if (Test-Path $exe) { throw 'uninstall left the app behind' }

      - uses: actions/upload-artifact@v4
        with:
          name: ImageGenKit-Setup
          path: dist/ImageGenKit-Setup-*.exe

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} dist/ImageGenKit-Setup-${{ env.IGK_VERSION }}.exe --clobber
