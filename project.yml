name: ImageGenKit
options:
  bundleIdPrefix: at.strics
  deploymentTarget:
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MACOSX_DEPLOYMENT_TARGET: '26.0'
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: '-'
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '1.0.2'
    CURRENT_PROJECT_VERSION: '3'
targets:
  ImageGenKit:
    type: application
    platform: macOS
    sources:
      - path: ImageGenKit
        excludes: [AppIcon.icon]
      - path: ImageGenKit/AppIcon.icon
        type: file
        buildPhase: resources
      - path: cli/imagegenkit.py
        buildPhase: resources
      - path: skill/SKILL.md
        buildPhase: resources
      - path: catalog/providers.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.strics.ImageGenKit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_CFBundleDisplayName: ImageGenKit
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: Grok Build, which makes images with your Grok subscription, may look at files in Documents.
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: To save and open images you choose on your Desktop.
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: To save and open images you choose in Downloads.
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright 2026 STRICS IT GmbH
      configs:
        # Release builds are signed with Developer ID and notarized through Xcode › Organizer › Direct Distribution.
        # Debug builds stay ad-hoc signed, so anyone can build from source without a team.
        Release:
          DEVELOPMENT_TEAM: J84L3TWP7T
          CODE_SIGN_IDENTITY: Apple Development
    scheme:
      testTargets: [ImageGenKitTests]
  ImageGenKitTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: ImageGenKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ImageGenKit.app/Contents/MacOS/ImageGenKit
