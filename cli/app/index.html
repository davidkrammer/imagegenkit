<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ImageGenKit</title>
<link rel="icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/app.css">
<script>window.IGK_TOKEN = "__IGK_TOKEN__";</script>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><img src="/static/icon.svg" alt=""><span>ImageGenKit</span></div>
    <nav>
      <button data-view="overview" class="nav active"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Overview</button>
      <button data-view="gallery" class="nav"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>Gallery</button>
      <button data-view="history" class="nav"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</button>
      <button data-view="settings" class="nav"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
    </nav>
    <div class="sidebar-foot">
      <button id="generate-open" class="btn primary wide"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg>Generate</button>
      <div id="ready-line" class="ready-line"><span class="dot"></span><span>…</span></div>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <div class="title"><h1 id="view-title">Overview</h1><div id="view-sub" class="sub"></div></div>
      <div class="filters" id="filters">
        <select id="f-provider" title="Provider"><option value="">All Providers</option></select>
        <select id="f-range" title="Time range">
          <option value="7">7 days</option><option value="30" selected>30 days</option>
          <option value="90">90 days</option><option value="365">12 months</option><option value="0">All time</option>
        </select>
        <input id="f-search" type="search" placeholder="Search prompts" class="hidden">
      </div>
    </header>

    <section id="view-overview" class="view active"></section>
    <section id="view-gallery" class="view"></section>
    <section id="view-history" class="view"></section>
    <section id="view-settings" class="view">
      <div class="tabs" id="settings-tabs">
        <button data-tab="providers" class="tab active">Providers</button>
        <button data-tab="images" class="tab">Images</button>
        <button data-tab="local" class="tab">On this PC</button>
        <button data-tab="limits" class="tab">Limits</button>
        <button data-tab="agents" class="tab">AI agents</button>
        <button data-tab="general" class="tab">General</button>
      </div>
      <div id="settings-body"></div>
    </section>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
