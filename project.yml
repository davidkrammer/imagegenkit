name: ImageGenKit
options:
  bundleIdPrefix: at.strics
  deploymentTarget:
    macOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MACOSX_DEPLOYMENT_TARGET: '26.0'
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: '-'
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  ImageGenKit:
    type: application
    platform: macOS
    sources:
      - path: ImageGenKit
      - path: cli/imagegenkit.py
        buildPhase: resources
      - path: skill/SKILL.md
        buildPhase: resources
      - path: catalog/providers.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.strics.ImageGenKit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_CFBundleDisplayName: ImageGenKit
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright 2026 STRICS IT GmbH
    scheme:
      testTargets: [ImageGenKitTests]
  ImageGenKitTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: ImageGenKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ImageGenKit.app/Contents/MacOS/ImageGenKit
